<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾词 - Wordwise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand"><img src="icons/icon48.png" width="30" height="30" alt=""><span>拾词</span><span class="brand-caption">Wordwise</span></div>
      <p class="header-note">把注意力留给阅读。</p>
    </header>

    <main class="main-content">
      <div class="status-section">
        <div class="status-info">
          <span class="status-label" id="toggleLabel">当前页面翻译</span>
          <span class="status-indicator inactive" id="statusIndicator" role="status" aria-live="polite">未激活</span>
        </div>
        <label class="toggle-switch" for="toggleTranslation">
          <input type="checkbox" id="toggleTranslation" role="switch" aria-labelledby="toggleLabel" aria-describedby="statusIndicator">
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>

      <div class="reading-stats" aria-label="阅读概况">
        <div class="stat"><span class="stat-label">已翻译词汇</span><strong id="wordCount">0</strong></div>
        <div class="stat"><span class="stat-label">英语水平</span><strong id="difficultyLevel">B2</strong></div>
      </div>

      <div class="actions">
        <button type="button" class="action-btn" id="settingsBtn"><span>偏好设置</span><span class="action-arrow" aria-hidden="true">↗</span></button>
      </div>
    </main>
    <footer class="footer">拾词 <span>·</span> 让英文阅读更轻松</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
